<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Téléchargement</title>

  <script>
    function isIOS() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      // iPhone / iPod / anciens iPad
      if (/iPhone|iPod/.test(ua)) return true;
      if (/iPad/.test(ua)) return true;

      // iPadOS récents (qui se font passer pour Mac)
      if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;

      return false;
    }

    function isAndroid() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;

  return /Android/i.test(ua)
    || /Linux/i.test(ua) && 'ontouchstart' in window;
}

    function redirect() {
      const playStore = "https://play.google.com/store/apps/details?id=com.kostaquent.bolstibetains";
      const appStore = "https://apps.apple.com/fr/app/interactive-singing-bowls/id6763084403";

      if (isAndroid()) {
        window.location.href = playStore;
      } 
      else if (isIOS()) {
        window.location.href = appStore;
      } 
      else {
        document.body.innerHTML = "<h2>Une erreur est survenue, essayez plus tard.</h2>";
      }
    }
  </script>
</head>

<body onload="redirect()">
  <p>Redirection en cours...</p>
</body>
</html>
